name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    permissions:
      contents: read
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # restore-mtime needs each file's last commit, not just the tip's

      - uses: jdx/mise-action@v2

      # Checkout stamps every file with the current time, so a restored .build would recompile everything (54 files,
      # measured on this runner). Commit times are the same on every checkout, so unchanged files match the cache.
      - name: Restore source mtimes
        run: python3 -I scripts/restore-mtime.py

      # Build products only fit the compiler that made them, so the toolchain is part of the key. The source hash
      # gives every change its own entry; restore-keys falls back to the newest one, and SwiftPM rebuilds only what
      # differs. This workflow and the mtime script are hashed too: a change to how the cache is built must not
      # exact-hit (and so never replace) an entry built the old way.
      - name: Cache key
        id: key
        run: |
          swift --version
          echo "toolchain=$(swift --version 2>&1 | shasum -a 256 | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Restore build cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ runner.arch }}-${{ steps.key.outputs.toolchain }}-${{ hashFiles('Package.swift', 'Sources/**', 'Vendor/**', 'scripts/restore-mtime.py', '.github/workflows/ci.yml') }}
          restore-keys: spm-${{ runner.os }}-${{ runner.arch }}-${{ steps.key.outputs.toolchain }}-

      - name: Build
        run: |
          set -o pipefail
          swift build --product Sorl 2>&1 | tee build.log
          # Vendored code is not ours to fix; any other warning fails the build.
          if grep -E "warning: " build.log | grep -v Vendor; then
            echo "::error::Build has warnings outside Vendor"
            exit 1
          fi

      - name: Test
        run: mise run test

      # The oldest supported macOS gets this exact app in the next job. ditto keeps the executable bit and the
      # signature, which upload-artifact's own zip would not.
      - name: Bundle for the Sequoia launch check
        run: |
          ./scripts/bundle.sh
          ditto -c -k --sequesterRsrc --keepParent build/Sorl.app Sorl.zip

      - uses: actions/upload-artifact@v4
        with:
          name: sorl-app
          path: Sorl.zip
          retention-days: 7

      # Only pushes to main save. PR runs can read main's caches but not each other's, so a cache saved
      # from a PR would only take up space (about 90 MB each, against the repo's 10 GB limit).
      - name: Save build cache
        if: github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .build
          key: ${{ steps.cache.outputs.cache-primary-key }}

  # The compiler catches 26-only APIs, but not a crash at launch or a panel that fails to build on the oldest
  # supported macOS. This launches the app built above on macOS 15 and drives it through its URL scheme.
  launch-on-sequoia:
    needs: build-and-test
    runs-on: macos-15
    permissions:
      contents: read

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sorl-app

      - name: Launch and open the panel
        run: |
          set -euo pipefail
          sw_vers
          ditto -x -k Sorl.zip .
          codesign --verify --strict Sorl.app
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f Sorl.app
          alive() {
            if ! pgrep -x Sorl >/dev/null; then
              echo "::error::Sorl is not running after: $1"
              ls ~/Library/Logs/DiagnosticReports/ 2>/dev/null | grep -i sorl && cat ~/Library/Logs/DiagnosticReports/Sorl* || true
              exit 1
            fi
          }
          defaults write com.karbassi.sorl syncEnabled -bool YES
          /usr/bin/open Sorl.app
          sleep 5; alive "launch"
          /usr/bin/open "sorl://mute"
          /usr/bin/open "sorl://open"
          sleep 3; alive "sorl://open"
          screencapture -x panel.png || echo "::warning::screencapture failed"
          /usr/bin/open "sorl://sync"
          sleep 2; alive "sorl://sync"
          /usr/bin/open "sorl://settings"
          sleep 2; alive "sorl://settings"
          screencapture -x settings.png || true
          /usr/bin/open "sorl://close"
          sleep 1; alive "sorl://close"
          if ls ~/Library/Logs/DiagnosticReports/ 2>/dev/null | grep -qi sorl; then
            echo "::error::Sorl left a crash report"
            exit 1
          fi
          echo "Sorl launched and opened the panel on macOS $(sw_vers -productVersion)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sequoia-screenshots
          path: '*.png'
          if-no-files-found: ignore
          retention-days: 7
