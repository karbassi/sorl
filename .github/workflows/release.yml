name: Release

# Runs three ways:
# - a vX.Y.Z tag pushed by hand;
# - called by auto-release.yml after it tags a merge (a tag pushed with GITHUB_TOKEN starts no workflow, so it calls this one instead);
# - by hand from the Actions tab, to build or rebuild an existing tag.
on:
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      tag:
        description: Existing tag to build and release, e.g. v1.4.0
        required: true
        type: string
    secrets:
      HOMEBREW_TAP_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and release, e.g. v1.4.0
        required: true
        type: string

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: write
    env:
      HAS_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
      # In a called workflow github.ref_name is the caller's ref (main), so every step reads the tag from here.
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0 # bundle.sh numbers the build from the commit count

      - name: Build and sign
        run: |
          # bundle.sh substitutes the version into Info.plist with sed; allow only vX.Y.Z[-suffix].
          version="${TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not vX.Y.Z or vX.Y.Z-suffix"
            exit 1
          fi
          swift --version
          # CFBundleShortVersionString must be X.Y.Z, so a prerelease's suffix stays on the tag only.
          ARCHS="arm64 x86_64" VERSION="${version%%-*}" ./scripts/bundle.sh
          lipo -archs build/Sorl.app/Contents/MacOS/Sorl

      - name: Create zip
        run: ditto -c -k --sequesterRsrc --keepParent build/Sorl.app Sorl.zip

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A rerun (e.g. after a failed tap dispatch) replaces the asset instead of failing.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Sorl.zip --clobber
            exit 0
          fi
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" Sorl.zip \
            --verify-tag \
            --title "$TAG" \
            --generate-notes \
            $prerelease

      # Stable releases only: the tap reads releases/latest, which skips prereleases.
      # Without the token the tap's daily auto-update still picks the release up.
      - name: Trigger homebrew-tap update
        if: env.HAS_TAP_TOKEN == 'true' && !contains(env.TAG, '-')
        uses: peter-evans/repository-dispatch@ff45666b9427631e3450c54a1bcbee4d9ff4d7c0 # v3.0.0
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          repository: karbassi/homebrew-tap
          event-type: release
          client-payload: '{"cask": "sorl"}'
